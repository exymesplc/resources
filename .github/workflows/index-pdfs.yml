name: Index PDFs to Algolia

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber algoliasearch

      - name: Scrape and index PDFs
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: |
          python << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import pdfplumber
          import io
          import os
          import asyncio
          from algoliasearch.search.client import SearchClient

          RESOURCES_URL = "https://www.exymesplc.com/resources"
          APP_ID = os.environ["ALGOLIA_APP_ID"]
          ADMIN_KEY = os.environ["ALGOLIA_ADMIN_KEY"]
          INDEX_NAME = "www_exymesplc_com_e3wswa1rj6_pages"

          print("Scraping resources page...")
          response = requests.get(RESOURCES_URL, timeout=30)
          soup = BeautifulSoup(response.text, "html.parser")

          # Build a map of framerusercontent URLs to their title and view URL
          # Each resource has a title link (resources.exymesplc.com) followed by a Download link (framerusercontent.com)
          pdf_links = []
          seen_download_urls = set()

          all_links = soup.find_all("a", href=True)
          for i, a in enumerate(all_links):
              href = a["href"]
              if "framerusercontent.com" in href and href.endswith(".pdf"):
                  if href in seen_download_urls:
                      continue
                  seen_download_urls.add(href)

                  # The title link is typically the previous sibling link
                  title = "Unknown"
                  view_url = href  # fallback to download URL
                  
                  # Look back through previous links for the resources.exymesplc.com URL
                  for prev_a in reversed(all_links[:i]):
                      prev_href = prev_a.get("href", "")
                      if "resources.exymesplc.com" in prev_href and prev_href.endswith(".pdf"):
                          view_url = prev_href
                          title = prev_a.get_text(strip=True)
                          break

                  pdf_links.append({
                      "title": title,
                      "url": view_url,
                      "download_url": href,
                  })

          print(f"Found {len(pdf_links)} PDFs")

          # Extract text from each PDF using the download URL
          records = []
          for pdf in pdf_links:
              print(f"Processing: {pdf['title']}")
              try:
                  pdf_response = requests.get(pdf["download_url"], timeout=30)
                  pdf_response.raise_for_status()

                  text_content = ""
                  with pdfplumber.open(io.BytesIO(pdf_response.content)) as f:
                      for page in f.pages:
                          text = page.extract_text()
                          if text:
                              text_content += text + " "

                  text_content = text_content.strip()[:5000]

                  if text_content:
                      record = {
                          "objectID": pdf["url"],
                          "url": pdf["url"],
                          "title": pdf["title"],
                          "description": text_content[:200],
                          "content": text_content,
                          "type": "pdf",
                      }
                      records.append(record)
                      print(f"Extracted {len(text_content)} characters")
                  else:
                      print(f"No text extracted from {pdf['title']}")

              except Exception as e:
                  print(f"Error processing {pdf['title']}: {e}")
                  continue

          print(f"Total records built: {len(records)}")

          async def push_to_algolia(records):
              client = SearchClient(APP_ID, ADMIN_KEY)
              try:
                  result = await client.save_objects(INDEX_NAME, records)
                  print(f"Algolia response: {result}")
                  print("Done.")
              finally:
                  await client.close()

          if records:
              print(f"Pushing {len(records)} records to Algolia...")
              asyncio.run(push_to_algolia(records))
          else:
              print("No records to push.")
          EOF
