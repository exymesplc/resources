name: Index Resources from Framer CMS to Algolia
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 2,5'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run indexer
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          ALGOLIA_APP_ID: E3WSWA1RJ6
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: node index-framer-cms.js
