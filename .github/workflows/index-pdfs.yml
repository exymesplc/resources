name: Index PDFs to Algolia

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfplumber algoliasearch

      - name: Scrape and index PDFs
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
        run: |
          python << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import pdfplumber
          import io
          import os
          import asyncio
          from algoliasearch.search.client import SearchClient

          RESOURCES_URL = "https://www.exymesplc.com/resources"
          APP_ID = os.environ["ALGOLIA_APP_ID"]
          ADMIN_KEY = os.environ["ALGOLIA_ADMIN_KEY"]
          INDEX_NAME = "www_exymesplc_com_e3wswa1rj6_pages"

          # Scrape PDF URLs from resources page
          print("Scraping resources page...")
          response = requests.get(RESOURCES_URL, timeout=30)
          soup = BeautifulSoup(response.text, "html.parser")

          pdf_links = []
          seen_urls = set()

          for a in soup.find_all("a", href=True):
              href = a["href"]
              if "framerusercontent.com" in href and href.endswith(".pdf"):
                  if href in seen_urls:
                      continue
                  seen_urls.add(href)

                  # Get the view URL from the nearest resources.exymesplc.com link
                  view_url = href
                  parent = a.find_parent()
                  if parent:
                      for sibling in parent.find_all("a", href=True):
                          if "resources.exymesplc.com" in sibling["href"]:
                              view_url = sibling["href"]
                              break

                  # Get title from the nearest heading element
                  title = href.split("/")[-1]
                  if parent:
                      heading = parent.find(["h1","h2","h3","h4","h5","p"])
                      if heading:
                          title = heading.get_text(strip=True) or title

                  pdf_links.append({
                      "url": view_url,
                      "download_url": href,
                      "title": title
                  })

          print(f"Found {len(pdf_links)} PDFs")

          # Extract text from each PDF
          records = []
          for pdf in pdf_links:
              print(f"Processing: {pdf['title']}")
              try:
                  pdf_response = requests.get(pdf["url"], timeout=30)
                  pdf_response.raise_for_status()

                  text_content = ""
                  with pdfplumber.open(io.BytesIO(pdf_response.content)) as f:
                      for page in f.pages:
                          text = page.extract_text()
                          if text:
                              text_content += text + " "

                  text_content = text_content.strip()[:5000]

                  if text_content:
                      record = {
                          "objectID": pdf["url"],
                          "url": pdf["url"],
                          "title": pdf["title"],
                          "description": text_content[:200],
                          "content": text_content,
                          "type": "pdf",
                      }
                      records.append(record)
                      print(f"Extracted {len(text_content)} characters")
                  else:
                      print(f"No text extracted from {pdf['title']}")

              except Exception as e:
                  print(f"Error processing {pdf['title']}: {e}")
                  continue

          print(f"Total records built: {len(records)}")

          # Push to Algolia asynchronously
          async def push_to_algolia(records):
              client = SearchClient(APP_ID, ADMIN_KEY)
              try:
                  result = await client.save_objects(INDEX_NAME, records)
                  print(f"Algolia response: {result}")
                  print("Done.")
              finally:
                  await client.close()

          if records:
              print(f"Pushing {len(records)} records to Algolia...")
              asyncio.run(push_to_algolia(records))
          else:
              print("No records to push.")
          EOF
